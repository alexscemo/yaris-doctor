name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # gh release create

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Offset keeps versionCode above the retired private builds (1000+), so phones that had one can still update
      - run: echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 2000))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Caches Gradle; the wrapper (8.11.1, committed) decides the version
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew test lint assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Signed release for Obtainium
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          # The notes are this version's CHANGELOG.md section; no section, no release
          awk -v v="[$VERSION_NAME]" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then echo "::error::CHANGELOG.md has no section for $VERSION_NAME"; exit 1; fi
          # 1.0.0-rc.1 and the like: Obtainium installs them only with "Include prereleases" on
          case "$VERSION_NAME" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "yaris-doctor-$GITHUB_REF_NAME.apk"
          gh release create "$GITHUB_REF_NAME" "yaris-doctor-$GITHUB_REF_NAME.apk" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $PRE
